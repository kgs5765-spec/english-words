<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jua',system-ui,-apple-system,'Malgun Gothic',sans-serif;background:linear-gradient(#bfe9ff,#fff5d6) fixed;min-height:100vh;color:#333;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  button:disabled{cursor:default}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;max-width:720px;margin:auto}
  .round{background:#fff;border-radius:50%;width:50px;height:50px;font-size:24px;box-shadow:0 4px 0 #0002}
  .total{background:#fff;padding:8px 18px;border-radius:24px;font-size:22px;box-shadow:0 4px 0 #0002}
  main{max-width:720px;margin:auto;padding:6px 16px 40px}

  .hero{text-align:center;margin:6px 0 20px}
  .hero-emoji{font-size:64px;display:inline-block;animation:bob 2s ease-in-out infinite}
  h1{font-size:40px;color:#ff6b6b;text-shadow:3px 3px 0 #fff}
  .hero p{font-size:20px;color:#666}
  .menu{display:grid;gap:12px}
  .menu-btn{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:14px 20px;text-align:left;border-bottom:6px solid var(--c);box-shadow:0 4px 12px #0001;transition:transform .1s}
  .mi{font-size:42px}
  .menu-btn b{display:block;font-size:25px;color:var(--c);font-weight:normal}
  small{font-size:16px;color:#777}
  button:active:not(:disabled){transform:scale(.95)}

  .title{text-align:center;font-size:32px;color:#2e86de;font-weight:normal}
  .sub{text-align:center;font-size:20px;color:#666;margin:4px 0 16px}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .cat-btn{background:#fff;border-radius:22px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:6px solid var(--c);box-shadow:0 4px 12px #0001}
  .ci{font-size:46px}
  .cat-btn b{font-size:23px;color:var(--c);font-weight:normal}
  .stars{font-size:22px;letter-spacing:2px}
  .stars .on{color:#ffc312}
  .stars .off{color:#ddd}
  .ghost{display:block;margin:20px auto 0;font-size:20px;color:#666;padding:10px 20px}

  .qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:20px}
  .bar{flex:1;height:18px;background:#fff;border-radius:9px;overflow:hidden;box-shadow:inset 0 2px 3px #0001}
  .bar div{height:100%;background:linear-gradient(90deg,#7bed9f,#2ed573);border-radius:9px;transition:width .4s}
  .prompt{background:#fff;border-radius:26px;padding:20px 16px;text-align:center;box-shadow:0 4px 12px #0001;margin-bottom:16px}
  .big-emoji{font-size:110px;line-height:1.2;display:inline-block;animation:pop .4s}
  .word{font-size:58px;color:#2e86de;letter-spacing:2px;animation:pop .4s}
  .ask{font-size:22px;color:#555;margin-top:6px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{background:#fff;border-radius:22px;padding:14px 8px;font-size:30px;box-shadow:0 6px 0 #dcdde1;min-height:86px}
  .choice.pic{font-size:62px}
  .choice.correct{background:#d4f8d4;box-shadow:0 6px 0 #2ed573;animation:pop .4s}
  .choice.wrong{background:#ffe0e0;box-shadow:0 6px 0 #ff6b6b;animation:shake .4s}
  .choice.dim{opacity:.45}
  .speak-big{font-size:70px;background:#ffeaa7;border-radius:50%;width:140px;height:140px;box-shadow:0 6px 0 #fdcb6e;animation:pulse 1.6s ease-in-out infinite}
  .speak{background:#dff3ff;padding:8px 18px;border-radius:20px;font-size:20px;margin-top:8px;box-shadow:0 3px 0 #b3dcf5}

  .slots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
  .slot{width:46px;height:58px;border-bottom:5px solid #c8d6e5;font-size:42px;color:#2e86de;display:flex;align-items:center;justify-content:center}
  .slot.filled{border-color:#2ed573;animation:pop .3s}
  .tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .tile{width:64px;height:64px;background:#fff;border-radius:18px;font-size:36px;box-shadow:0 6px 0 #dcdde1}
  .tile.used{visibility:hidden}
  .tile.hint{background:#fff6c2;animation:pulse .8s ease-in-out infinite}
  .tile.wrong{background:#ffe0e0;animation:shake .4s}

  .fb{min-height:76px;margin-top:16px;text-align:center;font-size:24px;opacity:0;transition:opacity .2s}
  .fb.show{opacity:1}
  .fb.good{color:#20bf6b}
  .fb.bad{color:#e17055}
  .fb .ans{color:#2e86de}

  .btn{background:#fff;padding:14px 24px;border-radius:20px;font-size:22px;box-shadow:0 5px 0 #dcdde1}
  .btn.primary{background:#ff9f43;color:#fff;box-shadow:0 5px 0 #e67e22}
  .btn.next{margin-top:10px;background:#2e86de;color:#fff;box-shadow:0 5px 0 #1b5fa8}
  .res-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}

  .result{text-align:center}
  .res-stars{font-size:72px;letter-spacing:6px}
  .res-stars span{display:inline-block;animation:pop .5s backwards}
  .res-stars span:nth-child(2){animation-delay:.2s}
  .res-stars span:nth-child(3){animation-delay:.4s}
  .result h2{font-size:36px;color:#2e86de;font-weight:normal}
  .result p{font-size:22px;color:#555;margin-top:6px}
  .review{background:#fff;border-radius:22px;padding:14px;margin-top:20px;box-shadow:0 4px 12px #0001}
  .review h3{font-size:22px;color:#e17055;font-weight:normal;margin-bottom:8px}
  .rv{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:14px;font-size:24px;text-align:left}
  .rv:nth-child(odd){background:#f7f9fc}
  .rv span{font-size:36px}
  .rv b{color:#2e86de;font-weight:normal}
  .rv small{flex:1}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .card{background:#fff;border-radius:22px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 #dcdde1}
  .card .ce{font-size:58px;line-height:1.2}
  .card b{font-size:26px;color:#2e86de;font-weight:normal}
  .card.bounce{animation:pop .4s}

  .confetti{position:fixed;top:-50px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:9}

  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes pulse{50%{transform:scale(1.08)}}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

  @media (max-width:420px){
    h1{font-size:34px}
    .big-emoji{font-size:92px}
    .word{font-size:46px}
    .choice{font-size:26px}
    .slot{width:40px;font-size:36px}
    .tile{width:56px;height:56px;font-size:32px}
  }
</style>
</head>
<body>
<header>
  <button class="round" id="homeBtn" aria-label="처음으로">🏠</button>
  <div class="total">⭐ <span id="total">0</span></div>
  <button class="round" id="sfxBtn" aria-label="효과음 켜기/끄기">🔔</button>
</header>
<main id="app"></main>

<script>
// ===== 단어 데이터 =====
const CATS = {
  animal: { name: '동물',     icon: '🐶', color: '#ff9f43' },
  food:   { name: '과일·음식', icon: '🍎', color: '#ee5253' },
  color:  { name: '색깔',     icon: '🎨', color: '#a55eea' },
  number: { name: '숫자',     icon: '🔢', color: '#2e86de' },
  body:   { name: '몸',       icon: '👀', color: '#10ac84' },
  thing:  { name: '물건·자연', icon: '🚗', color: '#e84393' },
};
const ALL_CAT = { name: '전체', icon: '🌈', color: '#576574' };

const WORDS = [
  // 동물
  ['cat','고양이','🐱','animal'], ['dog','개','🐶','animal'], ['pig','돼지','🐷','animal'],
  ['cow','소','🐮','animal'], ['duck','오리','🦆','animal'], ['fish','물고기','🐟','animal'],
  ['bird','새','🐦','animal'], ['lion','사자','🦁','animal'], ['bear','곰','🐻','animal'],
  ['rabbit','토끼','🐰','animal'], ['monkey','원숭이','🐵','animal'], ['frog','개구리','🐸','animal'],
  ['tiger','호랑이','🐯','animal'], ['horse','말','🐴','animal'], ['elephant','코끼리','🐘','animal'],
  // 과일·음식
  ['apple','사과','🍎','food'], ['banana','바나나','🍌','food'], ['grape','포도','🍇','food'],
  ['orange','오렌지','🍊','food'], ['lemon','레몬','🍋','food'], ['peach','복숭아','🍑','food'],
  ['strawberry','딸기','🍓','food'], ['watermelon','수박','🍉','food'], ['tomato','토마토','🍅','food'],
  ['carrot','당근','🥕','food'], ['corn','옥수수','🌽','food'], ['milk','우유','🥛','food'],
  ['egg','달걀','🥚','food'], ['bread','빵','🍞','food'], ['cake','케이크','🍰','food'], ['pizza','피자','🍕','food'],
  // 색깔
  ['red','빨간색','🔴','color'], ['blue','파란색','🔵','color'], ['yellow','노란색','🟡','color'],
  ['green','초록색','🟢','color'], ['purple','보라색','🟣','color'], ['black','검은색','⚫','color'],
  ['white','하얀색','⚪','color'], ['brown','갈색','🟤','color'],
  // 숫자
  ['one','하나 (1)','1️⃣','number'], ['two','둘 (2)','2️⃣','number'], ['three','셋 (3)','3️⃣','number'],
  ['four','넷 (4)','4️⃣','number'], ['five','다섯 (5)','5️⃣','number'], ['six','여섯 (6)','6️⃣','number'],
  ['seven','일곱 (7)','7️⃣','number'], ['eight','여덟 (8)','8️⃣','number'], ['nine','아홉 (9)','9️⃣','number'],
  ['ten','열 (10)','🔟','number'],
  // 몸
  ['eye','눈','👁️','body'], ['ear','귀','👂','body'], ['nose','코','👃','body'], ['mouth','입','👄','body'],
  ['hand','손','✋','body'], ['foot','발','🦶','body'], ['leg','다리','🦵','body'], ['arm','팔','💪','body'],
  ['tooth','이','🦷','body'],
  // 물건·자연
  ['book','책','📕','thing'], ['pencil','연필','✏️','thing'], ['bag','가방','🎒','thing'], ['ball','공','⚽','thing'],
  ['car','자동차','🚗','thing'], ['bus','버스','🚌','thing'], ['bike','자전거','🚲','thing'], ['train','기차','🚂','thing'],
  ['ship','배','🚢','thing'], ['sun','해','☀️','thing'], ['moon','달','🌙','thing'], ['star','별','⭐','thing'],
  ['tree','나무','🌳','thing'], ['flower','꽃','🌸','thing'], ['house','집','🏠','thing'], ['cup','컵','🥤','thing'],
  ['hat','모자','👒','thing'], ['clock','시계','⏰','thing'], ['umbrella','우산','☂️','thing'], ['robot','로봇','🤖','thing'],
  ['chair','의자','🪑','thing'], ['bed','침대','🛏️','thing'],
].map(([en, ko, e, c]) => ({ en, ko, e, c }));

const MODES = {
  study:   { name: '단어 카드',      desc: '카드를 누르면 소리가 나와요',  icon: '📖', color: '#10ac84' },
  pic:     { name: '그림 보고 고르기', desc: '그림에 맞는 영어 단어는?',     icon: '🖼️', color: '#ff9f43' },
  listen:  { name: '듣고 고르기',     desc: '소리를 듣고 그림을 골라요',     icon: '👂', color: '#a55eea' },
  meaning: { name: '뜻 고르기',       desc: '영어 단어의 뜻은 무엇일까요?',  icon: '💬', color: '#2e86de' },
  spell:   { name: '철자 맞추기',     desc: '글자를 순서대로 눌러요',       icon: '🔤', color: '#e84393' },
};
const ROUND = 10;
const SPELL_MAX = 6;

// ===== 저장 =====
let store = {};
try { store = JSON.parse(localStorage.getItem('english-words') || '{}'); } catch (e) {}
store.total = store.total || 0;
store.best = store.best || {};
if (store.sfx === undefined) store.sfx = true;
function save() { try { localStorage.setItem('english-words', JSON.stringify(store)); } catch (e) {} }

// ===== 도우미 =====
const $app = document.getElementById('app');
const state = { mode: null, cat: null, qs: [], i: 0, score: 0, wrong: [], locked: false, tk: 0 };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function render(html) { state.tk++; $app.innerHTML = html; window.scrollTo(0, 0); }
function later(fn, ms) { const tk = state.tk; setTimeout(() => { if (state.tk === tk) fn(); }, ms); }
function starHTML(n) { return [0, 1, 2].map(i => `<span class="${i < n ? 'on' : 'off'}">★</span>`).join(''); }
function catInfo(k) { return k === 'all' ? ALL_CAT : CATS[k]; }
function poolFor(cat) { return cat === 'all' ? WORDS : WORDS.filter(w => w.c === cat); }
function updateTotal() { document.getElementById('total').textContent = store.total; }
function updateSfxBtn() { document.getElementById('sfxBtn').textContent = store.sfx ? '🔔' : '🔕'; }

// ===== 발음 (브라우저 음성) =====
const hasTTS = 'speechSynthesis' in window;
let voice = null;
function loadVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft|Aria|Jenny/i.test(v.name))
       || vs.find(v => /en[-_]US/i.test(v.lang))
       || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (hasTTS) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function speak(text) {
  if (!hasTTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (voice) u.voice = voice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

// ===== 효과음 =====
let actx = null;
function tone(f, t, d, type = 'sine', v = 0.15) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + d);
}
function sfx(kind) {
  if (!store.sfx) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    if (kind === 'good') { tone(523, t, .12); tone(659, t + .1, .12); tone(784, t + .2, .3); }
    else if (kind === 'bad') { tone(330, t, .15, 'triangle'); tone(247, t + .15, .3, 'triangle'); }
    else if (kind === 'tick') { tone(880, t, .07, 'square', .04); }
    else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .13, .25)); }
  } catch (e) {}
}

function confetti() {
  const em = ['⭐', '🎉', '🌟', '🎈', '✨', '💖'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 2 + Math.random() * 2 + 's';
    s.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }
}

// ===== 화면: 처음 =====
function home() {
  if (hasTTS) speechSynthesis.cancel();
  render(`
    <div class="hero">
      <div class="hero-emoji">🦁📚</div>
      <h1>영어 단어 놀이터</h1>
      <p>재미있게 영어 단어를 배워요!</p>
    </div>
    <div class="menu">
      ${Object.entries(MODES).map(([k, m]) => `
        <button class="menu-btn" data-mode="${k}" style="--c:${m.color}">
          <span class="mi">${m.icon}</span>
          <span><b>${m.name}</b><small>${m.desc}</small></span>
        </button>`).join('')}
    </div>`);
  $app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    sfx('tick'); state.mode = b.dataset.mode; pickCat();
  });
}

// ===== 화면: 주제 고르기 =====
function pickCat() {
  const m = MODES[state.mode];
  const cats = [['all', ALL_CAT], ...Object.entries(CATS)];
  render(`
    <h2 class="title">${m.icon} ${m.name}</h2>
    <p class="sub">어떤 단어를 해볼까요?</p>
    <div class="cat-grid">
      ${cats.map(([k, c]) => `
        <button class="cat-btn" data-cat="${k}" style="--c:${c.color}">
          <span class="ci">${c.icon}</span><b>${c.name}</b>
          ${state.mode !== 'study' ? `<span class="stars">${starHTML(store.best[state.mode + ':' + k] || 0)}</span>` : ''}
        </button>`).join('')}
    </div>
    <button class="ghost" id="back">← 처음으로</button>`);
  $app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    sfx('tick'); state.cat = b.dataset.cat;
    state.mode === 'study' ? study() : startQuiz();
  });
  document.getElementById('back').onclick = home;
}

// ===== 화면: 단어 카드 =====
function study() {
  const c = catInfo(state.cat);
  const list = poolFor(state.cat);
  render(`
    <h2 class="title">📖 ${c.name}</h2>
    <p class="sub">카드를 누르면 소리가 나와요</p>
    <div class="cards">
      ${list.map((w, i) => `<button class="card" data-i="${i}"><span class="ce">${w.e}</span><b>${w.en}</b><small>${w.ko}</small></button>`).join('')}
    </div>
    <div class="res-btns">
      <button class="btn primary" id="quiz">✏️ 문제 풀러 가기</button>
      <button class="btn" id="back">← 뒤로</button>
    </div>`);
  $app.querySelectorAll('.card').forEach(b => b.onclick = () => {
    speak(list[b.dataset.i].en);
    b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce');
  });
  document.getElementById('quiz').onclick = () => { state.mode = 'pic'; startQuiz(); };
  document.getElementById('back').onclick = pickCat;
}

// ===== 문제 풀기 =====
function startQuiz() {
  let pool = poolFor(state.cat);
  if (state.mode === 'spell') pool = pool.filter(w => w.en.length <= SPELL_MAX);
  state.qs = shuffle(pool).slice(0, Math.min(ROUND, pool.length));
  state.i = 0; state.score = 0; state.wrong = [];
  showQ();
}

function makeChoices(ans) {
  const same = shuffle(WORDS.filter(w => w.c === ans.c && w !== ans));
  const other = shuffle(WORDS.filter(w => w.c !== ans.c));
  const picked = [];
  for (const w of same.concat(other)) {
    if (picked.length === 3) break;
    if ([ans, ...picked].some(p => p.ko === w.ko || p.e === w.e || p.en === w.en)) continue;
    picked.push(w);
  }
  return shuffle([ans, ...picked]);
}

function scrambled(word) {
  const letters = word.split('');
  let s = shuffle(letters);
  for (let t = 0; t < 10 && s.join('') === word; t++) s = shuffle(letters);
  return s;
}

function showQ() {
  state.locked = false;
  const q = state.qs[state.i], n = state.qs.length, mode = state.mode;
  const top = `<div class="qtop"><div class="bar"><div style="width:${state.i / n * 100}%"></div></div><span>${state.i + 1} / ${n}</span></div>`;
  let body = '', choices = null, letters = null;

  if (mode === 'pic') {
    choices = makeChoices(q);
    body = `<div class="prompt"><div class="big-emoji">${q.e}</div><p class="ask">이 그림은 영어로 무엇일까요?</p></div>
      <div class="choices">${choices.map((w, i) => `<button class="choice" data-i="${i}">${w.en}</button>`).join('')}</div>`;
  } else if (mode === 'listen') {
    choices = makeChoices(q);
    body = `<div class="prompt">
        ${hasTTS ? `<button class="speak-big" id="say" aria-label="다시 듣기">🔊</button><p class="ask">잘 듣고 맞는 그림을 골라요</p>`
                 : `<div class="word">${q.en}</div><p class="ask">이 단어에 맞는 그림을 골라요</p>`}
      </div>
      <div class="choices">${choices.map((w, i) => `<button class="choice pic" data-i="${i}">${w.e}</button>`).join('')}</div>`;
  } else if (mode === 'meaning') {
    choices = makeChoices(q);
    body = `<div class="prompt"><div class="word">${q.en}</div>
        ${hasTTS ? `<button class="speak" id="say">🔊 듣기</button>` : ''}
        <p class="ask">무슨 뜻일까요?</p></div>
      <div class="choices">${choices.map((w, i) => `<button class="choice" data-i="${i}">${w.ko}</button>`).join('')}</div>`;
  } else if (mode === 'spell') {
    letters = scrambled(q.en);
    body = `<div class="prompt"><div class="big-emoji">${q.e}</div>
        <p class="ask">${q.ko} ${hasTTS ? `<button class="speak" id="say">🔊</button>` : ''}</p>
        <div class="slots">${q.en.split('').map(() => `<span class="slot"></span>`).join('')}</div></div>
      <div class="tiles">${letters.map((l, i) => `<button class="tile" data-i="${i}">${l}</button>`).join('')}</div>`;
  }

  render(top + body + `<div id="fb" class="fb"></div>`);

  const say = document.getElementById('say');
  if (say) say.onclick = () => speak(q.en);
  if (mode === 'listen') later(() => speak(q.en), 350);

  if (choices) {
    $app.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(b, choices[b.dataset.i], choices));
  } else {
    setupSpell(q);
  }
}

function feedback(html, cls) {
  const fb = document.getElementById('fb');
  fb.innerHTML = html;
  fb.className = 'fb show ' + cls;
}

function choose(btn, picked, choices) {
  if (state.locked) return;
  state.locked = true;
  const q = state.qs[state.i];
  const btns = [...$app.querySelectorAll('.choice')];
  btns.forEach((b, i) => {
    b.disabled = true;
    if (choices[i] === q) b.classList.add('correct');
    else if (b !== btn) b.classList.add('dim');
  });
  speak(q.en);
  if (picked === q) {
    state.score++;
    sfx('good');
    feedback(`딩동댕! 잘했어요 🎉`, 'good');
    later(next, 1500);
  } else {
    btn.classList.add('wrong');
    state.wrong.push(q);
    sfx('bad');
    feedback(`괜찮아요! 정답은 <span class="ans">${q.e} ${q.en}</span> (${q.ko})<br><button class="btn next" id="nextBtn">다음 ▶</button>`, 'bad');
    document.getElementById('nextBtn').onclick = next;
  }
}

function setupSpell(q) {
  const slots = [...$app.querySelectorAll('.slot')];
  const tiles = [...$app.querySelectorAll('.tile')];
  let pos = 0, mistakes = 0;

  function showHint() {
    tiles.forEach(t => t.classList.remove('hint'));
    const t = tiles.find(t => !t.classList.contains('used') && t.textContent === q.en[pos]);
    if (t) t.classList.add('hint');
  }

  tiles.forEach(t => t.onclick = () => {
    if (state.locked || t.classList.contains('used')) return;
    if (t.textContent === q.en[pos]) {
      t.classList.add('used');
      tiles.forEach(x => x.classList.remove('hint'));
      slots[pos].textContent = q.en[pos];
      slots[pos].classList.add('filled');
      pos++;
      if (pos === q.en.length) {
        state.locked = true;
        speak(q.en);
        if (mistakes === 0) {
          state.score++;
          sfx('good');
          feedback(`완벽해요! 🎉 <span class="ans">${q.en}</span>`, 'good');
        } else {
          state.wrong.push(q);
          sfx('good');
          feedback(`다 맞췄어요! 👏 <span class="ans">${q.en}</span><br>다음엔 한 번에 해봐요`, 'bad');
        }
        later(next, 1800);
      } else {
        sfx('tick');
        if (mistakes >= 2) showHint();
      }
    } else {
      mistakes++;
      sfx('bad');
      t.classList.remove('wrong'); void t.offsetWidth; t.classList.add('wrong');
      setTimeout(() => t.classList.remove('wrong'), 400);
      if (mistakes >= 2) showHint();
    }
  });
}

function next() {
  state.i++;
  state.i >= state.qs.length ? result() : showQ();
}

// ===== 화면: 결과 =====
function result() {
  const n = state.qs.length, s = state.score, r = s / n;
  const stars = r >= 0.9 ? 3 : r >= 0.6 ? 2 : 1;
  const key = state.mode + ':' + state.cat;
  if ((store.best[key] || 0) < stars) store.best[key] = stars;
  store.total += stars;
  save(); updateTotal();
  const msg = stars === 3 ? '최고예요! 영어 박사님 🎓' : stars === 2 ? '잘했어요! 조금만 더 하면 만점! 💪' : '좋아요! 다시 하면 더 잘할 수 있어요 😊';
  render(`
    <div class="result">
      <div class="res-stars stars">${starHTML(stars)}</div>
      <h2>${n}문제 중 ${s}개 맞았어요!</h2>
      <p>${msg}</p>
      <p>별 ${stars}개를 받았어요 ⭐</p>
      ${state.wrong.length ? `
        <div class="review"><h3>다시 볼 단어</h3>
          ${state.wrong.map((w, i) => `<button class="rv" data-i="${i}"><span>${w.e}</span><b>${w.en}</b><small>${w.ko}</small>🔊</button>`).join('')}
        </div>` : ''}
      <div class="res-btns">
        <button class="btn primary" id="again">🔁 다시 하기</button>
        <button class="btn" id="other">📚 다른 주제</button>
        <button class="btn" id="home2">🏠 처음으로</button>
      </div>
    </div>`);
  $app.querySelectorAll('.rv').forEach(b => b.onclick = () => speak(state.wrong[b.dataset.i].en));
  document.getElementById('again').onclick = startQuiz;
  document.getElementById('other').onclick = pickCat;
  document.getElementById('home2').onclick = home;
  sfx('win');
  if (stars >= 2) confetti();
}

// ===== 시작 =====
document.getElementById('homeBtn').onclick = home;
document.getElementById('sfxBtn').onclick = () => { store.sfx = !store.sfx; save(); updateSfxBtn(); sfx('tick'); };
updateTotal();
updateSfxBtn();
home();
</script>
</body>
</html>
